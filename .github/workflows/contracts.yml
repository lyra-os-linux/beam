name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Controlled failure for branch-protection qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'test/ci-protection-1'
        run: |
          sleep 45
          echo '::error::Intentional failure to qualify required-check enforcement (issue #1).'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Install GTK and packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gettext appstream-util desktop-file-utils rpm zstd locales xvfb dbus-x11
          sudo sed -i 's/^# *\(en_US.UTF-8\|pt_BR.UTF-8\|es_ES.UTF-8\|zh_CN.UTF-8\)/\1/' /etc/locale.gen
          sudo locale-gen
      - name: Test and lint
        run: |
          cargo test --locked --workspace --all-targets
          cargo test --locked -p beam-core session::connector::tests -- --ignored
          timeout 60s dbus-run-session -- xvfb-run -a cargo test --locked -p beam-gtk closing_window_with_queued_input -- --ignored --test-threads=1
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          bash tests/test-i18n.sh
      - name: Validate desktop metadata and RPM spec
        run: |
          desktop-file-validate data/org.lyraos.Beam.desktop
          appstream-util validate-relax --nonet data/org.lyraos.Beam.metainfo.xml
          rpmspec -P packaging/beam.spec >/dev/null
      - name: Validate reproducible offline vendor source
        run: ./scripts/check-vendor-contract.sh
