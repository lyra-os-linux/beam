[package]
name = "beam-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri frontend for Beam"
build = "build.rs"

[[bin]]
name = "beam"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
beam-core = { path = "../beam-core" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.3.4"
# Clipboard da sessão: o GTK 3 que o próprio Tauri usa no Linux.
gtk = "0.18"
gio = "0.22.8"
glib = "0.22.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
